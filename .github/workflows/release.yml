name: Publicar Pacote NuGet
on:
  workflow_dispatch: # Permite que você clique em "Run workflow" manualmente na aba Actions do GitHub  
  release:
    types: [published]

jobs:
  build_and_publish:
    name: Build, Pack e Publish
    runs-on: ubuntu-latest
    
    # Permissões necessárias para o Trusted Publishing
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # Altere para a versão do seu .NET

      - name: Restaurar dependências
        run: dotnet restore

      - name: Criar Pacote (Pack)
        run: dotnet pack Wolfish.Maia/Wolfish.Maia.csproj -c Release --output ./nupkg

      - name: Publicar no NuGet
        uses: NuGet/setup-nuget@v2

        # ESTA ETAPA FAZ A MÁGICA DO TRUSTED PUBLISHING FUNCIONAR
      - name: Autenticar no NuGet via Trusted Publishing
        uses: NuGet/login@v1
        id: nuget_login

      - name: Enviar Pacote (Push)
        run: dotnet nuget push ./nupkg/*.nupkg --source
